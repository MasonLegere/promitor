parameters:
  - name: registryEndpoint
    type: string
    default: 'GitHub Container Registry'
  - name: tags
    type: string
  - name: dockerFile
    type: string
  - name: buildArgs
    type: string
    default: ''
  - name: buildContext
    type: string
    default: './src/'

steps:
  - task: Docker@2
    displayName: 'Docker login to ${{ parameters.registryEndpoint }}'
    inputs:
      containerRegistry: '${{ parameters.registryEndpoint }}'
      command: 'login'
      
  - bash: |
      set -euo pipefail
      
      # Setup buildx if not exists
      docker run --privileged --rm tonistiigi/binfmt --install arm64
      docker buildx create --name promitor-multiarch --driver docker-container --use --bootstrap 2>/dev/null || docker buildx use promitor-multiarch
      
      # Build and push with cache enabled to reuse builds if available
      docker buildx build \
        --builder promitor-multiarch \
        --platform linux/amd64,linux/arm64 \
        $TAGS \
        $BUILD_ARGS \
        --file "$DOCKERFILE" \
        --push \
        "$BUILD_CONTEXT"

    env:
      TAGS: ${{ parameters.tags }}
      BUILD_ARGS: ${{ parameters.buildArgs }}
      DOCKERFILE: ${{ parameters.dockerFile }}
      BUILD_CONTEXT: ${{ parameters.buildContext }}
    displayName: 'Build and push multi-platform images (linux/amd64,linux/arm64)'