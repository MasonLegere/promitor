parameters:
  - name: imageDisplayName
    type: string
    default: ''
  - name: imageName
    type: string

steps:
  - task: Docker@2
    displayName: 'Login to GitHub Container Registry'
    inputs:
      command: login
      containerRegistry: 'GitHub Container Registry'

  - task: Docker@2
    displayName: 'Pushing image ${{ parameters.imageDisplayName }}'
    inputs:
      command: 'push'
      repository: '${{ parameters.imageName }}'
