parameters:
  - name: registryEndpoint
    type: string
    default: 'GitHub Container Registry'
  - name: imageDisplayName
    type: string
    default: ''
  - name: imageName
    type: string

steps:
  - task: Docker@2
    displayName: 'Push ${{ parameters.imageDisplayName }} image to ${{ parameters.registryEndpoint }}'
    inputs:
      containerRegistry: '${{ parameters.registryEndpoint }}'
      command: 'push'
      repository: '${{ parameters.imageName }}'