parameters:
  - name: imageName
    type: string
  - name: dockerFile
    type: string
  - name: buildArgs
    type: string
    default: ''
  - name: tags
    type: string
    default: '--tag promitor-agent-scraper-ci'
  - name: buildContext
    type: string
    default: './src/'
    

steps:
  - bash: |
      set -euo pipefail
      docker run --privileged --rm tonistiigi/binfmt --install arm64
      docker buildx create --name promitor-multiarch --driver docker-container --use --bootstrap 2>/dev/null || docker buildx use promitor-multiarch
    displayName: 'Setup buildx for multi-platform builds (linux/amd64,linux/arm64)'
  
  - bash: |
      set -euo pipefail
      TAG_ARGS=''
      if [ -n "$TAGS" ]; then
        TAG_ARGS="$TAGS"
      fi
      BUILD_ARG_FLAGS=''
      if [ -n "$BUILD_ARGS" ]; then
        for arg in $BUILD_ARGS; do
          BUILD_ARG_FLAGS="$BUILD_ARG_FLAGS --build-arg $arg"
        done
      fi
      
      # Build both amd64 and arm64 to cache
      docker buildx build \
        --builder promitor-multiarch \
        --platform linux/amd64,linux/arm64 \
        --tag "$IMAGE_NAME" \
        $TAG_ARGS \
        $BUILD_ARG_FLAGS \
        --file "$DOCKERFILE" \
        --no-cache \
        "$BUILD_CONTEXT"
    env:
      IMAGE_NAME: ${{ parameters.imageName }}
      TAGS: ${{ parameters.tags }}
      BUILD_ARGS: ${{ parameters.buildArgs }}
      DOCKERFILE: ${{ parameters.dockerFile }}
      BUILD_CONTEXT: ${{ parameters.buildContext }}
    displayName: 'Build ${{ parameters.imageName }} multi-platform images (linux/amd64,linux/arm64)'
  
  - bash: |
      set -euo pipefail
      TAG_ARGS=''
      if [ -n "$TAGS" ]; then
        TAG_ARGS="$TAGS"
      fi
      BUILD_ARG_FLAGS=''
      if [ -n "$BUILD_ARGS" ]; then
        for arg in $BUILD_ARGS; do
          BUILD_ARG_FLAGS="$BUILD_ARG_FLAGS --build-arg $arg"
        done
      fi
      
      # Load only amd64 from cache for testing
      docker buildx build \
        --builder promitor-multiarch \
        --platform linux/amd64 \
        --tag "$IMAGE_NAME" \
        $TAG_ARGS \
        $BUILD_ARG_FLAGS \
        --file "$DOCKERFILE" \
        --load \
        "$BUILD_CONTEXT"
    env:
      IMAGE_NAME: ${{ parameters.imageName }}
      TAGS: ${{ parameters.tags }}
      BUILD_ARGS: ${{ parameters.buildArgs }}
      DOCKERFILE: ${{ parameters.dockerFile }}
      BUILD_CONTEXT: ${{ parameters.buildContext }}
    displayName: 'Load amd64 image for testing'
