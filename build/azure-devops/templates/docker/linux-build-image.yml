parameters:
  - name: tags
    type: string
  - name: dockerFile
    type: string
  - name: buildArgs
    type: string
    default: ''
  - name: buildContext
    type: string
    default: './src/'

steps:
  - bash: |
      set -euo pipefail
      docker run --privileged --rm tonistiigi/binfmt --install arm64
      docker buildx create --name promitor-multiarch --driver docker-container --use --bootstrap 2>/dev/null || docker buildx use promitor-multiarch
    displayName: 'Setup buildx for multi-platform builds (linux/amd64,linux/arm64)'
    
  - bash: |
      set -euo pipefail
      
      # Build both amd64 and arm64 to cache
      docker buildx build \
        --builder promitor-multiarch \
        --platform linux/amd64,linux/arm64 \
        $TAGS \
        $BUILD_ARGS \
        --file "$DOCKERFILE" \
        --no-cache \
        "$BUILD_CONTEXT"
    env:
      TAGS: ${{ parameters.tags }}
      BUILD_ARGS: ${{ parameters.buildArgs }}
      DOCKERFILE: ${{ parameters.dockerFile }}
      BUILD_CONTEXT: ${{ parameters.buildContext }}
    displayName: 'Build multi-platform images (linux/amd64,linux/arm64)'
    
  - bash: |
      set -euo pipefail
      
      # Load only amd64 from cache for testing with all tags
      docker buildx build \
        --builder promitor-multiarch \
        --platform linux/amd64 \
        $TAGS \
        $BUILD_ARGS \
        --file "$DOCKERFILE" \
        --load \
        "$BUILD_CONTEXT"
    env:
      TAGS: ${{ parameters.tags }}
      BUILD_ARGS: ${{ parameters.buildArgs }}
      DOCKERFILE: ${{ parameters.dockerFile }}
      BUILD_CONTEXT: ${{ parameters.buildContext }}
    displayName: 'Load amd64 image for integration testing'