parameters:
  - name: builderName
    type: string
  - name: tags
    type: string
  - name: dockerFile
    type: string
  - name: buildArgs
    type: string
    default: ''
  - name: buildContext
    type: string
    default: './src/'

steps:
    
  - bash: |
      set -euo pipefail
      
      # Build both amd64 and arm64 to cache
      docker buildx build \
        --builder $BUILDER_NAME \
        --platform linux/amd64,linux/arm64 \
        $TAGS \
        $BUILD_ARGS \
        --file "$DOCKERFILE" \
        --no-cache \
        "$BUILD_CONTEXT"
    env:
      BUILDER_NAME: ${{ parameters.builderName }}
      TAGS: ${{ parameters.tags }}
      BUILD_ARGS: ${{ parameters.buildArgs }}
      DOCKERFILE: ${{ parameters.dockerFile }}
      BUILD_CONTEXT: ${{ parameters.buildContext }}
    displayName: 'Build multi-platform images (linux/amd64,linux/arm64)'
    
  - bash: |
      set -euo pipefail
      
      # Load only amd64 from cache for testing
      docker buildx build \
        --builder $BUILDER_NAME \
        --platform linux/amd64 \
        $TAGS \
        $BUILD_ARGS \
        --file "$DOCKERFILE" \
        --load \
        "$BUILD_CONTEXT"
    env:
      BUILDER_NAME: ${{ parameters.builderName }}
      TAGS: ${{ parameters.tags }}
      BUILD_ARGS: ${{ parameters.buildArgs }}
      DOCKERFILE: ${{ parameters.dockerFile }}
      BUILD_CONTEXT: ${{ parameters.buildContext }}
    displayName: 'Load amd64 image for integration testing'