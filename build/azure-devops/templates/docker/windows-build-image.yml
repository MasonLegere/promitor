parameters:
  - name: imageName
    type: string
  - name: dockerFile
    type: string
  - name: buildArgs
    type: string
    default: ''
  - name: tags
    type: string
    default: ''
  - name: buildContext
    type: string
    default: './src/'

steps:
  - task: Docker@2
    displayName: 'Build ${{ parameters.imageName }} image (windows)'
    inputs:
      containerRegistry: 'GitHub Container Registry'
      command: 'build'
      Dockerfile: ${{ parameters.dockerFile }}
      arguments: '${{ parameters.buildArgs }} --no-cache'
      buildContext: ${{ parameters.buildContext }}
      tags: ${{ parameters.tags }}
      addDefaultLabels: false
