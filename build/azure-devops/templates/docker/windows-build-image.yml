parameters:
  - name: imageName
    type: string
  - name: dockerFile
    type: string
  - name: buildArgs
    type: string
    default: ''
  - name: tags
    type: string
    default: '--tag promitor-agent-scraper-ci'
  - name: buildContext
    type: string
    default: './src/'

steps:
  - task: Docker@2
    displayName: 'Build ${{ parameters.imageName }} image (windows)'
    inputs:
      command: 'build'
      Dockerfile: ${{ parameters.dockerFile }}
      arguments: '${{ parameters.tags }} ${{ parameters.buildArgs }} --no-cache'
      buildContext: ${{ parameters.buildContext }}
      addDefaultLabels: false
